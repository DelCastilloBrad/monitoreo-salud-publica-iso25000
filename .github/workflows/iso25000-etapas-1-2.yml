name: ISO 25000 - preparación y métricas

on:
  push:
    branches: [evaluacion-iso25000-etapas-1-2]
  workflow_dispatch:

jobs:
  medicion:
    name: Medición en ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - name: Obtener solo el módulo evaluado
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            monitoreo_salud_publica
            tests
            scripts

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias de la medición
        shell: bash
        run: |
          python -m pip install -r monitoreo_salud_publica/requirements.txt
          python -m pip install pymetrica==1.6.0 pytest coverage

      - name: Registrar el entorno real
        shell: bash
        run: python scripts/capture_environment.py reports/environment.json

      - name: Medir estructura del módulo con Pymetrica
        shell: bash
        run: pymetrica run-all -rt JSON monitoreo_salud_publica > reports/pymetrica.json

      - name: Ejecutar Pytest con Coverage.py
        shell: bash
        run: |
          python -m coverage run --source=monitoreo_salud_publica -m pytest tests/test_monitoreo.py -q --junitxml=reports/pytest.xml
          python -m coverage json -o reports/coverage.json
          python -m coverage report > reports/coverage.txt

      - name: Conservar evidencia de cada sistema
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iso25000-etapas-1-2-${{ matrix.os }}
          path: reports/
          if-no-files-found: warn
