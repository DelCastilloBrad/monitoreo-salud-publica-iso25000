name: T5 - Evaluacion comparativa
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evaluar:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar herramientas
        run: python -m pip install radon==6.0.1 pylint==3.3.8 bandit==1.8.6
      - name: Ejecutar y producir informes
        shell: bash
        run: |
          mkdir -p t5-results
          python -m radon cc -j -s monitoreo_salud_publica/monitoreo_salud_publica/app.py > t5-results/radon_cc.json
          python -m radon mi -j monitoreo_salud_publica/monitoreo_salud_publica/app.py > t5-results/radon_mi.json
          python -m radon raw -j monitoreo_salud_publica/monitoreo_salud_publica/app.py > t5-results/radon_raw.json
          python -m pylint monitoreo_salud_publica/monitoreo_salud_publica/app.py --output-format=json --score=n > t5-results/pylint.json || true
          python -m bandit -q -f json monitoreo_salud_publica/monitoreo_salud_publica/app.py > t5-results/bandit.json || true
          python - <<'PY'
          import json, pathlib, platform, subprocess, sys, html
          p=pathlib.Path('t5-results')
          def get(name):
              try: return json.loads((p/name).read_text())
              except Exception: return {}
          cc=get('radon_cc.json'); mi=get('radon_mi.json'); raw=get('radon_raw.json')
          pl=get('pylint.json'); bd=get('bandit.json')
          functions=[f for fs in cc.values() for f in fs] if isinstance(cc,dict) else []
          rawvals=list(raw.values()) if isinstance(raw,dict) else []
          mivals=list(mi.values()) if isinstance(mi,dict) else []
          loc=sum(x.get('loc',0) for x in rawvals if isinstance(x,dict))
          values={'commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'os':platform.platform(),'python':sys.version.split()[0],'loc':loc,'cc_max':max((x.get('complexity',0) for x in functions),default=None),'cc_mean':round(sum(x.get('complexity',0) for x in functions)/len(functions),2) if functions else None,'maintainability_index':round(sum(x.get('mi',0) for x in mivals if isinstance(x,dict))/len(mivals),2) if mivals else None,'pylint_issues':len(pl) if isinstance(pl,list) else None,'bandit_findings':len(bd.get('results',[])) if isinstance(bd,dict) else None,'complex_functions_gt10':sum(x.get('complexity',0)>10 for x in functions)}
          (p/'summary.json').write_text(json.dumps(values,indent=2,ensure_ascii=False))
          rows=''.join('<tr><th>'+html.escape(str(k))+'</th><td>'+html.escape(str(v))+'</td></tr>' for k,v in values.items())
          (p/'reporte.html').write_text('<!doctype html><html lang="es"><meta charset="utf-8"><title>T5</title><style>body{font:17px system-ui;max-width:1000px;margin:45px auto}table{border-collapse:collapse;width:100%}td,th{padding:12px;border:1px solid #ccc;text-align:left}th{background:#dff0ff}</style><h1>Evaluación T5</h1><table>'+rows+'</table><p>Resultados exploratorios de análisis estático; no equivalen a certificación ISO/IEC 5055 ni a benchmarks de rendimiento.</p></html>')
          with open(__import__('os').environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('## Evaluación T5 — '+platform.system()+'\n\n| Indicador | Valor |\n|---|---|\n')
              for k,v in values.items(): f.write(f'| {k} | {v} |\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t5-${{ matrix.os }}
          path: t5-results/
          retention-days: 30
