name: T5 - Evaluacion integral comparativa
on:
  workflow_dispatch:
  push:
    paths:
      - 't5/**'
      - 'monitoreo_salud_publica/**'
      - '.github/workflows/t5-evaluacion-comparativa.yml'
permissions:
  contents: read
jobs:
  evaluar:
    name: T5 en ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar herramientas y dependencias
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r t5/requirements.txt
          python -m pip install -r monitoreo_salud_publica/monitoreo_salud_publica/requirements.txt
      - name: Analisis integral
        shell: bash
        run: python t5/full.py --source monitoreo_salud_publica/monitoreo_salud_publica/app.py --out t5/results/ci --repeats 10
      - name: Resumen visible
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json,os,pathlib
          p=pathlib.Path('t5/results/ci/summary.json')
          if p.exists():
              d=json.loads(p.read_text(encoding='utf-8'))
              s=['## Evaluacion T5','- Sistema: '+str(d.get('system')),'- Commit: '+str(d.get('git_commit')),'- LLOC: '+str(d.get('lloc')),'- Radon CC maxima: '+str(d.get('cc_max')),'- Pylint: '+str(d.get('pylint_alerts')),'- Bandit: '+str(d.get('bandit_alerts')),'- Candidatos EF: '+str(d.get('efficiency_candidates')),'- Dinamica: '+str(d.get('dynamic',{}).get('status')),'- EF04: requiere confirmacion manual']
              with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as f:f.write('\n'.join(s)+'\n')
          PY
      - name: Subir resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t5-${{ matrix.os }}
          path: t5/results/ci/
          if-no-files-found: warn
  sonarcloud:
    name: SonarCloud (opcional, requiere SONAR_TOKEN y variables)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        if: ${{ vars.SONAR_PROJECT_KEY != '' && vars.SONAR_ORGANIZATION != '' }}
        with:
          fetch-depth: 0
      - name: Analisis SonarCloud
        if: ${{ vars.SONAR_PROJECT_KEY != '' && vars.SONAR_ORGANIZATION != '' }}
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.sources=monitoreo_salud_publica/monitoreo_salud_publica
            -Dsonar.host.url=https://sonarcloud.io
      - name: Estado de configuracion
        if: ${{ vars.SONAR_PROJECT_KEY == '' || vars.SONAR_ORGANIZATION == '' }}
        run: echo "SonarCloud no configurado; establecer variables SONAR_PROJECT_KEY y SONAR_ORGANIZATION y secreto SONAR_TOKEN."
